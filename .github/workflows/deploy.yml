name: Publish canonical personal site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify static pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Configure root Pages site
        if: github.repository == 'sachncs/sachncs.github.io'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: github.repository == 'sachncs/sachncs.github.io'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Publish at sachncs.github.io
    if: github.repository == 'sachncs/sachncs.github.io'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy root site
        id: deployment
        uses: actions/deploy-pages@v4
