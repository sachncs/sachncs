name: Refresh radar data

on:
  schedule:
    # Every Sunday at 03:30 UTC
    - cron: "30 3 * * 0"
  workflow_dispatch:
  push:
    paths:
      - "data/axes.json"
      - "data/config.json"
      - "scripts/build_data.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data + render fallback PNGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_data.py

      - name: Commit if changed
        run: |
          git config user.name "sachncs-bot"
          git config user.email "sachncs-bot@users.noreply.github.com"
          git add data/repos.json data/radar.png data/radar-by-lang.png data/radar-animated.svg || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh radar data ($(date -u +%Y-%m-%d))"
            git push
          fi