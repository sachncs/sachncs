<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sachncs · capability radar</title>
  <meta name="description" content="Interactive radar visualization of every repo by sachncs." />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%237c3aed'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="assets/app.js" type="module" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo"></span>
      <span class="title">sachncs · capability radar</span>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <main class="layout">
    <section class="canvas-wrap">
      <div class="canvas-inner">
        <canvas id="radar" aria-label="Repo capability radar"></canvas>
      </div>
      <div class="hint" id="hint">click a repo in the legend to solo · click an axis label to dim weak repos · use chips to filter by language</div>
    </section>

    <aside class="sidebar">
      <div class="card">
        <h3>View</h3>
        <div class="row">
          <label class="switch">
            <input type="checkbox" id="groupByLang" />
            <span>Group by language</span>
          </label>
        </div>
        <div class="row">
          <button class="btn ghost" id="resetBtn" type="button">Reset all</button>
        </div>
      </div>

      <div class="card">
        <h3>Languages</h3>
        <div class="chips" id="langChips"></div>
      </div>

      <div class="card">
        <h3>Sort</h3>
        <select id="sortBy" class="select">
          <option value="score">By total score</option>
          <option value="name">By name (A→Z)</option>
          <option value="recent">By most recent push</option>
          <option value="stars">By stars</option>
        </select>
        <div class="row">
          <input id="search" class="input" type="search" placeholder="Filter repos…" />
        </div>
      </div>

      <div class="card">
        <h3>Repos <span class="badge" id="legendCount">0</span></h3>
        <div class="legend" id="legend"></div>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <span id="generatedAt"></span>
    ·
    <a href="https://github.com/sachncs/sachncs" target="_blank" rel="noopener">view source</a>
    ·
    <a href="data/radar-by-lang.png" target="_blank" rel="noopener">static png</a>
  </footer>
</body>
</html>
